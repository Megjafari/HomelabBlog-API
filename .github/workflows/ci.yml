name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore homelabblogapi.csproj

      - name: Build
        run: dotnet build --no-restore --configuration Release homelabblogapi.csproj

      - name: Test
        run: dotnet test tests/HomelabBlog.Api.Tests --configuration Release
